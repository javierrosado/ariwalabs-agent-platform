  version: 0.1.0
  rubrics:
    growth-marketing.request-validation:
      min_score: 0.8
      criteria:
        - id: schema_compliance
          weight: 0.4
          required: true
          description: El output cumple el JSON Schema declarado por la skill.
        - id: no_declared_errors
          weight: 0.2
          required: true
          description: El output no declara errores recuperables o bloqueantes.
        - id: approval_consistency
          weight: 0.2
          required: false
          description: Si requiere aprobacion, incluye una razon explicita.
